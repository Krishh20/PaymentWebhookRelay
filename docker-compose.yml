services:
  db:
    image: postgres:16-alpine
    container_name: payment-relay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_dev_password
      POSTGRES_DB: payment_relay
    ports:
      - "5432:5432"
    volumes:
      - payment_relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d payment_relay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payment_relay_pgdata:
